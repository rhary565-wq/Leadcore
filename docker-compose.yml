# Local run with Docker:  docker compose up --build   → http://localhost:3000
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 8080
    ports: ["8080:8080"]
    # Needed only for the self-hosted Google Maps engine (gosom) — lets the backend start scraper containers
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports: ["3000:8080"]
    depends_on: [backend]
